# Corre en los PR como chequeo, y en main además publica.
name: CI y deploy a GitHub Pages

on:
  push:
    branches: [main]
  # Los mismos chequeos sobre el PR, antes de mergear. Hasta acá sólo corrían
  # DESPUÉS del merge, así que un test intermitente no se veía en el PR: se veía
  # fallando el deploy, con el cambio ya en main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Un grupo por referencia. Con `pages` para todo, los chequeos de un PR
  # hacían cola detrás de un deploy —y al revés, que es peor—.
  group: ${{ github.workflow }}-${{ github.ref }}
  # En un PR, un push nuevo cancela la corrida anterior: ya no interesa.
  # En main NO se cancela: un deploy a medias deja Pages inconsistente.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Calidad antes que deploy: un push que no compila o rompe un test
      # no llega a producción.
      - run: npm run lint
      - run: npm run typecheck
      # La suite normal. En CI este paso NO recibe los secrets, así que ya
      # actúa como aislada — pero eso era implícito y por eso el bug pasó
      # desapercibido en local. Ver ADR-019.
      - run: npm test

      # Y la suite aislada explícita: corre ignorando cualquier .env, así
      # falla igual si alguien la ejecuta en una máquina que sí lo tiene.
      - run: npm run test:isolated

      - run: npm run build
        env:
          # La app se sirve desde la RAÍZ de app.buscatools.com. Ya no se
          # inyecta VITE_BASE_PATH: el default de vite.config.ts es '/'.
          # Si alguna vez hubiera que publicar bajo un subdirectorio, se
          # vuelve a definir acá y nada más.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # El servicio público de la bandeja de Emails. Es una URL, no un secreto:
          # la autorización la da el JWT de Supabase de cada persona.
          VITE_EMAILS_API_URL: https://buscatools-erp-email-api-545134968830.us-east1.run.app

      # De acá para abajo es publicar, y un PR no publica. Sin este `if`,
      # agregar el disparador `pull_request` mandaría CADA PR a producción.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
