name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # No cancelar un deploy a medias: dejaría Pages en estado inconsistente.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Calidad antes que deploy: un push que no compila o rompe un test
      # no llega a producción.
      - run: npm run lint
      - run: npm run typecheck
      # La suite normal. En CI este paso NO recibe los secrets, así que ya
      # actúa como aislada — pero eso era implícito y por eso el bug pasó
      # desapercibido en local. Ver ADR-019.
      - run: npm test

      # Y la suite aislada explícita: corre ignorando cualquier .env, así
      # falla igual si alguien la ejecuta en una máquina que sí lo tiene.
      - run: npm run test:isolated

      - run: npm run build
        env:
          # La app se sirve desde la RAÍZ de app.buscatools.com. Ya no se
          # inyecta VITE_BASE_PATH: el default de vite.config.ts es '/'.
          # Si alguna vez hubiera que publicar bajo un subdirectorio, se
          # vuelve a definir acá y nada más.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
