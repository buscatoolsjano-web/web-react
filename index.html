<!doctype html>
<html lang="es-AR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F37021" />
    <meta name="description" content="Buscatools ERP — sistema de gestión" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!--
      Abrir el socket a Supabase ANTES de que haga falta.

      Medido en el build de producción: la primera consulta —la que resuelve
      sesión y empresa— tarda ~360 ms con el socket frío y ~85 ms con el socket
      caliente. Esa diferencia no es la base respondiendo distinto: es DNS, TCP
      y TLS hasta São Paulo, que recién se pagan a los ~280 ms, cuando React ya
      montó y dispara la consulta.

      Con `preconnect` el navegador arranca esa negociación junto con el HTML, en
      paralelo con bajar y ejecutar el JS, y cuando la consulta sale el socket ya
      está. Y es el primer eslabón de una cadena de tres, así que lo que se
      ahorra acá adelanta todo lo que viene después.

      `crossorigin` NO es opcional: las consultas van con `Authorization`, o sea
      CORS. Un preconnect sin este atributo abre un socket anónimo que el
      navegador NO reutiliza para pedidos con credenciales, y el preconnect no
      sirve de nada sin que nada avise.
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!--
      Dos rescates de URL, ANTES de que corra nada de la app (es un script
      clásico en el <head>: se ejecuta mientras se parsea, antes que el módulo
      de `main.tsx`, que es diferido). Los dos existen por el cambio a router
      de browser de la Fase 88.

      1. El `?/` que arma `public/404.html`. GitHub Pages contesta 404 a
         cualquier path que no sea un archivo —las rutas dinámicas del ERP y
         del carrito—; ese 404.html reescribe `/ventas/pedidos/3` como
         `/?/ventas/pedidos/3` y manda acá. Esto lo vuelve a `/ventas/pedidos/3`
         con `replaceState`, sin recargar, antes de que monte el router.

      2. Los marcadores viejos `/#/inicio`. Durante años las URL del ERP
         tuvieron hash; quien tenga uno guardado caería en la raíz pública.
         Esto traduce `#/inicio` a `/inicio`.

      Lo que NO se toca: un fragmento que no empieza con `/` —`#access_token=…`
      o `#error=…` de Supabase Auth—. Ése lo procesa `capturarCallback`, y si
      esto lo borrara se perdería la sesión del enlace de invitación.
    -->
    <script>
      (function () {
        var l = window.location

        // 1. Decodificar el redirect de 404.html: `/?/ruta&a=b` → `/ruta?a=b`.
        if (l.search && l.search.charAt(1) === '/') {
          var decodificada = l.search
            .slice(1)
            .split('&')
            .map(function (parte) {
              return parte.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decodificada + l.hash)
        }

        // 2. Rescatar un marcador viejo con hash de ruta: `#/inicio` → `/inicio`.
        //    Sólo `#/…`: `#access_token=…` no empieza con barra y no entra acá.
        if (window.location.hash.indexOf('#/') === 0) {
          window.history.replaceState(null, '', window.location.hash.slice(1))
        }
      })()
    </script>

    <!--
      Adelanto de los datos de la portada (Fase 176).

      El cuello de botella al ENTRAR ya no es la base —las RPC están en ~150 ms—:
      es que el navegador tiene que bajar y ejecutar ~220 KB de JS ANTES de que
      React monte y recién ahí pida los productos. Medido: la primera consulta
      sale a los ~800 ms, cuando el HTML ya está desde los ~310 ms.

      Este script CLÁSICO corre mientras se parsea el HTML —antes del módulo de
      main.tsx, que es diferido— y dispara YA las tres consultas de la portada,
      en paralelo con la bajada del JS. Cuando React monta, la respuesta ya está
      (o está en vuelo) y `catalogoPublico.ts` la adopta en vez de volver a
      pedir: los productos aparecen apenas hidrata, sin esperar la ida y vuelta.

      Sólo la portada SIN filtros (`/` o `/productos` sin query): es la entrada
      más común y la que se nota lenta. Cualquier otra ruta sigue el camino
      normal. Si algo falla —o la clave no se reemplazó—, no pasa nada: el
      servicio cae al pedido de siempre.
    -->
    <script>
      (function () {
        try {
          var p = window.location.pathname.replace(/\/+$/, '')
          if ((p === '' || p === '/productos') && !window.location.search) {
            var base = '%VITE_SUPABASE_URL%/rest/v1/rpc/'
            var key = '%VITE_SUPABASE_ANON_KEY%'
            var h = {
              apikey: key,
              Authorization: 'Bearer ' + key,
              'Content-Type': 'application/json',
              Accept: 'application/json',
            }
            var pedir = function (fn, cuerpo) {
              return fetch(base + fn, { method: 'POST', headers: h, body: JSON.stringify(cuerpo) })
            }
            window.__pf = {
              categorias: pedir('catalogo_publico_categorias', {}),
              facetas: pedir('catalogo_publico_facetas', {
                p_categoria: null, p_marca: null, p_serie: null, p_tipo: null,
                p_atributos: null, p_texto: null, p_modelo: null,
              }),
              listar: pedir('catalogo_publico_listar', {
                p_categoria: null, p_marca: null, p_texto: null, p_modelo: null,
                p_serie: null, p_tipo: null, p_atributos: null, p_pagina: 1, p_por_pagina: 100,
              }),
            }
          }
        } catch (e) {
          /* si algo falla, el servicio hace el pedido normal */
        }
      })()
    </script>

    <title>Buscatools ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
