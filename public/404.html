<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buscatools</title>
    <meta name="robots" content="noindex" />
    <script>
      /*
       * Rescate de rutas servidas como path en GitHub Pages (Fase 88).
       *
       * La app usa router de BROWSER: sus URL son `/ventas/pedidos/3`,
       * `/oauth/consent?authorization_id=x`, `/productos/x/y` (las que no se
       * prerenderizan). GitHub Pages sólo sirve archivos; a un path que no es
       * un archivo contesta este 404.html. Entonces esto guarda la ruta
       * pedida y manda a la raíz, donde `index.html` la reconstruye y recién
       * ahí monta el router. Es el truco estándar de spa-github-pages.
       *
       * La ruta viaja en el query, no en el path: `/ventas/pedidos/3?x=1`
       * pasa a `/?/ventas/pedidos/3&x=1`. Así la raíz —que SÍ es un archivo—
       * se sirve con 200, y `index.html` deshace la transformación antes de
       * arrancar. Los `&` originales del query se escapan como `~and~` para no
       * confundirse con el separador que mete esto.
       *
       * ── Por qué ahora es general y antes era sólo /oauth/ ─────────────────
       *
       * Con router de hash, un path suelto era un error real y sólo /oauth/
       * necesitaba el rescate. Con router de browser, TODA ruta dinámica llega
       * como path: el fallback tiene que ser general o el ERP no abre con la
       * página recargada. Las fichas y categorías NO pasan por acá: ésas son
       * HTML prerenderizado que GitHub sirve con 200 directo.
       *
       * `noindex`: esto es la página de 404 del hosting. Que un buscador que
       * caiga acá —un path inexistente— no la indexe como si fuera contenido.
       *
       * El destino se arma sólo con la URL de la propia dirección y siempre
       * relativo al origen: no hay forma de que esto mande a otro sitio.
       */
      (function () {
        var l = window.location
        l.replace(
          l.protocol +
            '//' +
            l.host +
            '/?/' +
            l.pathname.slice(1).replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        )
      })()
    </script>
  </head>
  <body>
    <p>Buscatools</p>
  </body>
</html>
